services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: ammonia-qc-api:1.0.0
    container_name: ammonia-qc-api
    ports:
      - "8000:8000"
    environment:
      AMMONIA_DB_PATH: /data/ammonia.db
    volumes:
      - ammonia-data:/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2).status == 200 else 1)"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  ammonia-data:
